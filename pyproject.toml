[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personaforge"
version = "0.1.0"
description = "Population-grounded user simulation and synthetic preference-data pipeline for small-model post-training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Changqi Hoang" }]
keywords = ["synthetic-data", "user-simulation", "llm-post-training", "sft", "dpo", "qlora"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]
train = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.0",
  "datasets>=2.19.0",
  "peft>=0.12.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.9.6",
]
api = ["openai>=1.40.0"]
plots = ["matplotlib>=3.8.0"]

[project.scripts]
personaforge = "personaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"personaforge.sample_data" = ["*.jsonl"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

